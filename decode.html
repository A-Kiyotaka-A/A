<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشافاشة - فك التشفير</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 data-text="🔓 فك الشافاشة">🔓 فك الشافاشة</h1>
        <p class="subtitle">[ نظام فك التشفير - الإصدار 2.0 ]</p>

        <textarea id="inputCipher" placeholder="> الصق الرسالة المشفرة هنا..."></textarea>
        <button id="decryptBtn">[ فك التشفير ]</button>

        <div id="decryptedSection" class="hidden">
            <h3 class="terminal-text">> الرسالة الأصلية:</h3>
            <div id="outputDecrypted" class="output-box"></div>
            
            <div class="button-group">
                <button id="copyDecryptedBtn">[ نسخ الأصلية ]</button>
                <button id="newMessageBtn">[ رسالة جديدة ]</button>
            </div>
        </div>

        <div class="status-bar">
            النظام جاهز - في انتظار البيانات المشفرة...
        </div>
    </div>
    <script src="decrypt.js"></script>
</body>
</html>
