<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشافاشة - تشفير</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 data-text="🕵️ الشافاشة">🕵️ الشافاشة</h1>
        <p class="subtitle">[ نظام التشفير غير المرئي - الإصدار 2.0 ]</p>

        <textarea id="inputText" placeholder="> أدخل الرسالة السرية هنا..."></textarea>
        <button id="encryptBtn">[ تشفير الرسالة ]</button>

        <div id="resultSection" class="hidden">
            <h3 class="terminal-text">> الرسالة المشفرة:</h3>
            <div id="outputText" class="output-box"></div>
            
            <div class="button-group">
                <button id="copyTextBtn">[ نسخ الرسالة ]</button>
                <button id="copyLinkBtn">[ نسخ رابط الفك ]</button>
            </div>
            
            <button id="newEncryptBtn" style="margin-top: 15px;">[ رسالة جديدة ]</button>
        </div>

        <div class="status-bar">
            اللغات المدعومة: العربية | English | 日本語 | 中文 | 한국어 | Français | Deutsch | Español | Русский | हिन्दी
        </div>
    </div>
    <script src="encrypt.js"></script>
</body>
</html>
